location /assets/ { try_files $uri =404; }

    # API (PHP) under /api (use ^~ so this block wins over other regex locations MIAB may define)
    location ^~ /api/ {
        # Map URL /api/* to filesystem /home/user-data/www/pfadfinder-fotos.marekworks.at/api/public/*
        alias /home/user-data/www/pfadfinder-fotos.marekworks.at/api/public/;
        index index.php;
        # Keep fallback inside /api so the nested PHP handler processes it
        try_files $uri $uri/ /index.php?$query_string;

            # Direct handlers for media scripts to avoid front-controller fallback
            location = /api/thumb.php {
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME /home/user-data/www/pfadfinder-fotos.marekworks.at/api/public/thumb.php;
                fastcgi_param SCRIPT_NAME /thumb.php;
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            }

            location = /api/image.php {
                include fastcgi_params;
                fastcgi_param SCRIPT_FILENAME /home/user-data/www/pfadfinder-fotos.marekworks.at/api/public/image.php;
                fastcgi_param SCRIPT_NAME /image.php;
                fastcgi_pass unix:/run/php/php8.4-fpm.sock;
            }

        limit_except GET POST DELETE {
           deny all;
        }

        # Handle PHP via FPM within this alias context
        location ~ \.*$ {
            # Normalize script path for alias: strip leading /api so it maps under the aliased root
            rewrite ^/api(/.*)$ index.php?$1 break;
            # rewrite /api/public/index.phpx?(/.*)$ $1 break;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /home/user-data/www/pfadfinder-fotos.marekworks.at/api/public/$fastcgi_script_name;
            fastcgi_param SCRIPT_NAME $fastcgi_script_name;
            # Update PHP-FPM socket/path if different on your MIAB instance
            fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        }
    }

    # Support API calls when frontend path prefix '/g' leaks into API: map /g/api/* to /api/*
    location ^~ /g/api/ {
        rewrite ^/g/api/(.*)$ /api/$1 last;
    }

    # SPA fallback for React (exclude /api)
    location / {
        try_files $uri /index.html;
    }